# Horco CMSIS-DAP/DAPLink -> STM32F407VET6
# 在 CLion 的“OpenOCD 下载并运行”配置中，将本文件选为板级配置文件。

source [find interface/cmsis-dap.cfg]
transport select swd

source [find target/stm32f4x.cfg]

# 当前板载应用会立即启动USB和外设；连接时保持NRST可避免运行态SWD
# 偶发只能读取DPIDR、无法检查内核。需要DAPLink已连接NRST。
reset_config srst_only srst_nogate connect_assert_srst

# 先使用较保守的 SWD 时钟，链路稳定后可提高到 2000 kHz。
adapter speed 1000
